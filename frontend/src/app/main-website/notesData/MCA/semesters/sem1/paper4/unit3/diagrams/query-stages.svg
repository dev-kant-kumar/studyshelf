<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Logical query stages and available information</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">Logical query stages and available information</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">This is a reasoning model, not a captured physical plan.</text><rect x="35" y="125" width="270" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="155" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">1. FROM / JOIN</text><text x="51" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Construct related rows</text><text x="51" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Outer joins preserve a side</text><rect x="345" y="125" width="270" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="361" y="155" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">2. WHERE</text><text x="361" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Keep TRUE input rows</text><text x="361" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Group values do not exist yet</text><rect x="655" y="125" width="270" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="671" y="155" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">3. GROUP BY</text><text x="671" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Form groups</text><text x="671" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Compute aggregate inputs</text><rect x="655" y="330" width="270" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="671" y="360" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">4. HAVING</text><text x="671" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Keep qualifying groups</text><text x="671" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Evaluate group conditions</text><rect x="345" y="330" width="270" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="361" y="360" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">5. SELECT / windows</text><text x="361" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Produce expressions</text><text x="361" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Annotate available rows</text><rect x="35" y="330" width="270" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="360" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">6. ORDER / limit</text><text x="51" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Define presentation order</text><text x="51" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Apply intended row limit</text><path d="M305 195 L345 195" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 195 L655 195" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M790 270 L790 330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 400 L615 400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M345 400 L305 400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">Aliases, group counts, and window positions become usable at the appropriate query level.</text></svg>