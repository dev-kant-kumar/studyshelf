<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>Explicit cursor: consume only successful fetches</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="680" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">Explicit cursor: consume only successful fetches</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">MCA students are 101 Asha, 102 Ravi, and 104 Neha.</text><rect x="35" y="120" width="270" height="100" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">DECLARE -&gt; OPEN</text><text x="51" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Position: before first row</text><rect x="365" y="120" width="250" height="100" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="381" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">FETCH</text><text x="381" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Obtain one candidate row</text><rect x="365" y="315" width="250" height="100" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><text x="381" y="345" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Exhausted?</text><text x="381" y="375" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Check status before use</text><rect x="35" y="315" width="270" height="100" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="345" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Process valid row</text><text x="51" y="375" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Insert into result table</text><rect x="675" y="315" width="250" height="100" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="691" y="345" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">CLOSE</text><text x="691" y="375" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Release open resource</text><rect x="365" y="515" width="560" height="95" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/><text x="381" y="545" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Failure path</text><text x="381" y="575" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Close if open; propagate the error. Do not silently succeed.</text><path d="M305 170 L365 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 220 L490 315" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M365 365 L305 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">No</text><path d="M170 315 L170 260 L400 260 L400 220" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 365 L675 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="630" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">Yes</text><path d="M550 220 L645 220 L645 485 L650 515" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="35" y="490" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#1e293b" text-anchor="start">Fetch 4: no valid row; no fourth insert.</text><text x="36" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">A cursor loop is not required for a simple INSERT ... SELECT. Justify per-row procedural work.</text></svg>