<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>A stored procedure has a contract</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">A stored procedure has a contract</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Example: count recorded marks for one supplied course code.</text><rect x="35" y="120" width="270" height="115" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Caller supplies IN</text><text x="51" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">p_course = &#x27;DB101&#x27;</text><text x="51" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Not a concatenated SQL string</text><rect x="365" y="120" width="250" height="115" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="381" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Validate</text><text x="381" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Reject missing code</text><rect x="675" y="120" width="250" height="115" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="691" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Read data</text><text x="691" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">COUNT(mark)</text><text x="691" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">82, 88, NULL -&gt; 2</text><rect x="675" y="365" width="250" height="115" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="691" y="395" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Assign OUT</text><text x="691" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">p_marked = 2</text><rect x="365" y="365" width="250" height="115" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/><text x="381" y="395" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Failure outcome</text><text x="381" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">NULL input -&gt; exception</text><rect x="35" y="365" width="270" height="115" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="395" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Transaction ownership</text><text x="51" y="425" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">No COMMIT in this routine</text><text x="51" y="451" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Caller controls larger work</text><path d="M305 175 L365 175" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M615 175 L675 175" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 235 L800 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 235 L490 365" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="495" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">invalid input</text><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">Unknown non-NULL course returns zero in this contract; distinguish it from empty courses if required.</text></svg>