<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>The denominator changes the meaning</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">The denominator changes the meaning</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">The DB101 input has three enrolments but only two recorded marks.</text><rect x="45" y="125" width="325" height="160" rx="8" fill="white" stroke="#94a3b8"/><path d="M45 165H370" stroke="#94a3b8"/><text x="57" y="151" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">student_id</text><text x="237" y="151" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">mark</text><text x="57" y="191" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101</text><text x="237" y="191" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">82</text><text x="57" y="231" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">102</text><text x="237" y="231" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">88</text><text x="57" y="271" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">103</text><text x="237" y="271" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">NULL</text><rect x="470" y="125" width="440" height="140" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="486" y="155" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Ordinary aggregates</text><text x="486" y="185" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">COUNT(*) = 3; COUNT(mark) = 2</text><text x="486" y="211" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">SUM(mark) = 170</text><text x="486" y="237" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AVG(mark) = 170 / 2 = 85</text><path d="M370 200 L470 200" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="355" width="390" height="140" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="61" y="385" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">A missing mark is not zero</text><text x="61" y="415" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">NULL means no recorded value.</text><text x="61" y="441" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AVG ignores it in its denominator.</text><rect x="520" y="355" width="390" height="140" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><text x="536" y="385" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Explicitly substitute zero</text><text x="536" y="415" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AVG(COALESCE(mark, 0))</text><text x="536" y="441" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">= 170 / 3, about 56.67</text><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">Choose a grading policy explicitly; do not change missing data merely to make arithmetic convenient.</text></svg>