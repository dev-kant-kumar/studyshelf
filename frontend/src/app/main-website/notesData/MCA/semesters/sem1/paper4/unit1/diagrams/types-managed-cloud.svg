<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">Managed cloud deployment: divided responsibilities</title><desc id="desc">The provider operates a database service; the application team still designs its use.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs><rect width="960" height="650" rx="16" fill="#f8fafc"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#16324f">Managed cloud deployment: divided responsibilities</text>
<text x="40" y="82" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#16324f">The provider operates a database service; the application team still designs its use.</text>
<rect x="40" y="125" width="390" height="245" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="58" y="159" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Application team</text>
<text x="58" y="192" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">Defines entities and schema</text>
<text x="58" y="222" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">Implements workflows</text>
<text x="58" y="252" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">Chooses access policies</text>
<text x="58" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">Connects using service credentials</text>
<rect x="530" y="125" width="390" height="245" rx="10" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/>
<text x="548" y="159" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16324f">Managed service</text>
<text x="548" y="192" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">Runs the database infrastructure</text>
<text x="548" y="222" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">Provides configured operations</text>
<text x="548" y="252" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">Backup / monitoring facilities</text>
<text x="548" y="282" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">Available features vary by service</text>
<path d="M435 240 L525 240" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#tip)"/>
<rect x="155" y="440" width="650" height="80" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="173" y="474" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16324f">Shared task: configure and verify the agreed guarantees</text>
<text x="40" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Managed hosting is not a new data model and does not remove all DBA work.</text>
<text x="40" y="617" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Backup, availability, access, and service settings still need verification.</text>
</svg>
