<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Client-server deployment: separate database service</title><desc id="desc">The application sends requests over a connection to a server process.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#16324f">Client-server deployment: separate database service</text>
<text x="40" y="82" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#16324f">The application sends requests over a connection to a server process.</text>
<rect x="40" y="180" width="320" height="150" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="58" y="214" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Client process</text>
<text x="58" y="247" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">Registration application</text>
<text x="58" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">Database driver</text>
<rect x="560" y="180" width="360" height="150" rx="10" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/>
<text x="578" y="214" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Server process</text>
<text x="578" y="247" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">DBMS service</text>
<text x="578" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">Query and transaction work</text>
<path d="M365 245 L555 245" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#tip)"/>
<text x="387" y="223" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#0f766e">SQL request</text>
<path d="M560 295 L365 295" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#tip)"/>
<text x="383" y="321" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#0f766e">rows / status</text>
<rect x="560" y="425" width="360" height="75" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="578" y="459" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Server-managed storage</text>
<path d="M740 330 L740 420" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#tip)"/>
<text x="40" y="540" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">A server can accept many client connections with controlled concurrent work.</text>
<text x="40" y="567" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Client-server describes interaction, independently of the data model.</text>
</svg>
