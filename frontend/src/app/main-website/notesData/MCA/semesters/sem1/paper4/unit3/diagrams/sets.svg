<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Membership and duplicate occurrences</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">Membership and duplicate occurrences</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">A = students taking DB101; B = students taking CS101.</text><rect x="45" y="120" width="390" height="190" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="61" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">A: {101, 102, 103}</text><text x="61" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101 Asha: also in B</text><text x="61" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">102 Ravi: only in A</text><text x="61" y="232" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">103 Mira: also in B</text><rect x="525" y="120" width="390" height="190" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="541" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">B: {101, 103}</text><text x="541" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101 Asha: also in A</text><text x="541" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">103 Mira: also in A</text><rect x="45" y="365" width="870" height="200" rx="8" fill="white" stroke="#94a3b8"/><path d="M45 405H915" stroke="#94a3b8"/><text x="57" y="391" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Operation</text><text x="337" y="391" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Result</text><text x="637" y="391" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">What is retained</text><text x="57" y="431" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">A UNION B</text><text x="337" y="431" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101, 102, 103</text><text x="637" y="431" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Distinct membership</text><text x="57" y="471" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">A INTERSECT B</text><text x="337" y="471" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101, 103</text><text x="637" y="471" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Shared membership</text><text x="57" y="511" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">A EXCEPT B / MINUS B</text><text x="337" y="511" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">102</text><text x="637" y="511" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Left-only membership</text><text x="57" y="551" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">A UNION ALL B</text><text x="337" y="551" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101, 101, 102, 103, 103</text><text x="637" y="551" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Every occurrence</text><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">Whole result rows define duplicates. Difference is directional; UNION ALL preserves multiplicity.</text></svg>