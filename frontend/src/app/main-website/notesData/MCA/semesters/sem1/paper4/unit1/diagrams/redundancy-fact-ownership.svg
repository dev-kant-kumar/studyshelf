<text x="40" y="640" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Change the authoritative contact once; enrolments retain the student identifier.</text>
<text x="40" y="667" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Indexes, replicas, and backups may still duplicate data for defined purposes.</text>
