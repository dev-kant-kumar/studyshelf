<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>The Unit 3 college database</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="680" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">The Unit 3 college database</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Keys identify facts; foreign keys connect them without repeating names.</text><rect x="40" y="115" width="340" height="60" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="56" y="145" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">U3Student: one row per student</text><rect x="40" y="180" width="340" height="200" rx="8" fill="white" stroke="#94a3b8"/><path d="M40 220H380" stroke="#94a3b8"/><text x="52" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">student_id (PK)</text><text x="202" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">name</text><text x="287" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">programme</text><text x="52" y="246" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101</text><text x="202" y="246" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Asha</text><text x="287" y="246" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">MCA</text><text x="52" y="286" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">102</text><text x="202" y="286" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Ravi</text><text x="287" y="286" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">MCA</text><text x="52" y="326" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">103</text><text x="202" y="326" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Mira</text><text x="287" y="326" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">MBA</text><text x="52" y="366" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">104</text><text x="202" y="366" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Neha</text><text x="287" y="366" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">MCA</text><rect x="580" y="115" width="340" height="60" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="596" y="145" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">U3Course: one row per course</text><rect x="580" y="180" width="340" height="160" rx="8" fill="white" stroke="#94a3b8"/><path d="M580 220H920" stroke="#94a3b8"/><text x="592" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">course_code (PK)</text><text x="812" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">credits</text><text x="592" y="246" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101</text><text x="812" y="246" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">3</text><text x="592" y="286" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">CS101</text><text x="812" y="286" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">4</text><text x="592" y="326" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AI101</text><text x="812" y="326" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">3</text><rect x="250" y="440" width="460" height="155" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="266" y="470" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">U3Enrolment: one row per pairing</text><text x="266" y="500" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">PK = (student_id, course_code)</text><text x="266" y="526" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">FK student_id -&gt; U3Student</text><text x="266" y="552" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">FK course_code -&gt; U3Course</text><text x="266" y="578" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">mark = 0..100 or NULL</text><path d="M200 380 L200 405 L340 405 L340 440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="427" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">0..many enrolments</text><path d="M750 340 L750 405 L620 405 L620 440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="385" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">0..many enrolments</text><text x="36" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">Each enrolment has exactly one existing student and one existing course; both FKs are NOT NULL.</text></svg>