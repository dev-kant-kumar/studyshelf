<text x="40" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">t1 -&gt; t2: INSERT student 102.     t2 -&gt; t3: UPDATE student 101 name.</text>
<text x="40" y="670" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">The three valid states share the same column definitions and key rule.</text>
<text x="40" y="697" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">An empty Student table would also be a possible state of this schema.</text>
