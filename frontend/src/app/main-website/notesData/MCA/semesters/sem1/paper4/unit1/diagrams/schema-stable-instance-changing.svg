<text x="56" y="152" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Unchanged schema: Student(student_id, name)</text>
<text x="56" y="184" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#16324f">student_id: INTEGER PRIMARY KEY; name: required text</text>
