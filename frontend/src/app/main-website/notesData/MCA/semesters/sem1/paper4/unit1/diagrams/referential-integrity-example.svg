<text x="51" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">student_id (PK)</text>
<text x="301" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">name</text>
<path d="M290 169 V289" stroke="#cbd5e1"/>
<text x="51" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">101</text>
<text x="301" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Asha</text>
<path d="M290 169 V289" stroke="#cbd5e1"/>
<path d="M40 209 H440" stroke="#cbd5e1"/>
<text x="51" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">102</text>
<text x="301" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Ravi</text>
<path d="M290 169 V289" stroke="#cbd5e1"/>
<path d="M40 249 H440" stroke="#cbd5e1"/>
<rect x="520" y="120" width="400" height="169" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="532" y="152" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Enrolment</text>
<path d="M520 169 L920 169" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="531" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">student_id (FK)</text>
<text x="781" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">course</text>
<path d="M770 169 V289" stroke="#cbd5e1"/>
<text x="531" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">101</text>
<text x="781" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">DB101</text>
<path d="M770 169 V289" stroke="#cbd5e1"/>
<path d="M520 209 H920" stroke="#cbd5e1"/>
<text x="531" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">101</text>
<text x="781" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">CS101</text>
