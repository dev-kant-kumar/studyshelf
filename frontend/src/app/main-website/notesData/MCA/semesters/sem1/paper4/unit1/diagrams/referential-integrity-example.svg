<text x="452" y="220" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#0f766e">match</text>
<rect x="40" y="435" width="400" height="120" rx="9" fill="#ecfdf5" stroke="#94a3b8" stroke-width="2"/>
<text x="56" y="467" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">Proposed reference: 101</text>
<text x="56" y="499" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Existing Student key</text>
<text x="56" y="528" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">May be referenced again</text>
<rect x="520" y="435" width="400" height="120" rx="9" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/>
<text x="536" y="467" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">Proposed reference: 999</text>
<text x="536" y="499" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">No matching Student key</text>
<text x="536" y="528" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Reject the enrolment</text>
<text x="40" y="670" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Student PK is unique; Enrolment FK values may repeat across different courses.</text>
<text x="40" y="697" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">The complete enrolment key (student_id, course) remains unique in this design.</text>
</svg>
