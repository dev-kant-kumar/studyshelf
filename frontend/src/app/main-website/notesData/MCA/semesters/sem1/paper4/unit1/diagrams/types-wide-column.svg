<text x="514" y="272" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#16324f">Partition: CS101</text>
<path d="M500 289 H920" stroke="#94a3b8"/>
<text x="512" y="317" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">student_id</text>
<text x="667" y="317" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">name</text>
<path d="M655 289 V369" stroke="#cbd5e1"/>
