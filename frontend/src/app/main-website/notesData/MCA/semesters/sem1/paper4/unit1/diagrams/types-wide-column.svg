<text x="512" y="357" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">101</text>
<text x="667" y="357" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">Asha</text>
<path d="M655 289 V369" stroke="#cbd5e1"/>
<text x="827" y="357" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">91</text>
<path d="M815 289 V369" stroke="#cbd5e1"/>
<path d="M500 329 H920" stroke="#e2e8f0"/>
<text x="55" y="469" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">course_code selects a partition.</text>
<text x="55" y="504" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">student_id orders rows within that partition.</text>
<text x="40" y="590" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">This is one concrete wide-column design; other systems use different details.</text>
<text x="40" y="617" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">It is not a diagram of column-oriented analytical storage.</text>
</svg>
