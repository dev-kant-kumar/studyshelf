<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">Wide-column DBMS: query-oriented partitions</title><desc id="desc">Cassandra-style example: retrieve enrolments for one course.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs><rect width="960" height="650" rx="16" fill="#f8fafc"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#16324f">Wide-column DBMS: query-oriented partitions</text>
<text x="40" y="82" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#16324f">Cassandra-style example: retrieve enrolments for one course.</text>
<rect x="40" y="120" width="880" height="75" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="58" y="154" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#16324f">Logical key: ((course_code), student_id)</text>
<rect x="40" y="240" width="420" height="169" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="54" y="272" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#16324f">Partition: DB101</text>
