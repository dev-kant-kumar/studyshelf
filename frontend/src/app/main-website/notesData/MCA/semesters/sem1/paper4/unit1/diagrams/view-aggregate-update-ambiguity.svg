<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" role="img" aria-labelledby="title desc"><title id="title">Why an aggregate view is not a unique update target</title><desc id="desc">A count summarises rows without identifying which new row should be inserted.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs><rect width="960" height="730" rx="16" fill="#f8fafc"/>
<text x="40" y="48" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#16324f">Why an aggregate view is not a unique update target</text>
<text x="40" y="82" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#16324f">A count summarises rows without identifying which new row should be inserted.</text>
<rect x="40" y="120" width="430" height="169" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="52" y="152" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Base Enrolment</text>
<path d="M40 169 L470 169" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="51" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">student_id</text>
<text x="296" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">course</text>
<path d="M285 169 V289" stroke="#cbd5e1"/>
<text x="51" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">101</text>
<text x="296" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">DB101</text>
<path d="M285 169 V289" stroke="#cbd5e1"/>
<path d="M40 209 H470" stroke="#cbd5e1"/>
<text x="51" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">102</text>
<text x="296" y="277" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">DB101</text>
<path d="M285 169 V289" stroke="#cbd5e1"/>
<path d="M40 249 H470" stroke="#cbd5e1"/>
<rect x="570" y="120" width="350" height="129" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="582" y="152" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">CourseCount view</text>
<path d="M570 169 L920 169" fill="none" stroke="#0f766e" stroke-width="3"/>
<text x="581" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">course</text>
<text x="791" y="197" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">total</text>
<path d="M780 169 V249" stroke="#cbd5e1"/>
<text x="581" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">DB101</text>
<text x="791" y="237" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">2</text>
<path d="M780 169 V249" stroke="#cbd5e1"/>
<path d="M570 209 H920" stroke="#cbd5e1"/>
<path d="M475 225 L565 225" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#tip)"/>
<text x="482" y="195" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#0f766e">COUNT</text>
<rect x="570" y="365" width="350" height="100" rx="9" fill="#fff7ed" stroke="#94a3b8" stroke-width="2"/>
<text x="586" y="397" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16324f">Requested change</text>
<text x="586" y="429" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">Set total to 3</text>
<rect x="40" y="420" width="430" height="120" rx="9" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
<text x="56" y="452" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16324f">Which new student?</text>
<text x="56" y="484" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">103, 104, or someone else?</text>
<text x="56" y="513" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#16324f">The aggregate does not say.</text>
<path d="M565 415 L475 460" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#tip)"/>
<text x="500" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#0f766e">?</text>
<text x="40" y="670" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">A proper enrolment operation identifies the student and enforces the rules.</text>
<text x="40" y="697" text-anchor="start" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#16324f">The count can then be derived again from the updated base data.</text>
</svg>
