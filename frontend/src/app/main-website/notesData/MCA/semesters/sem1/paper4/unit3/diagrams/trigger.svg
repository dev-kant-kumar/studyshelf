<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img"><title>One UPDATE, two changed marks, two audit rows</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="680" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">One UPDATE, two changed marks, two audit rows</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Audit action runs during statement execution, not after commit.</text><rect x="35" y="120" width="890" height="100" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">UPDATE DB101 marks where mark IS NOT NULL</text><text x="51" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Asha 82 -&gt; 83; Ravi 88 -&gt; 89; Mira NULL remains unchanged</text><rect x="35" y="300" width="410" height="135" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="330" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Row-trigger engines</text><text x="51" y="360" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Oracle / PostgreSQL / MySQL / SQLite</text><text x="51" y="386" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Two row events; compare OLD and NEW</text><text x="51" y="412" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Insert one audit row per actual change</text><rect x="515" y="300" width="410" height="135" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="531" y="330" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">SQL Server statement trigger</text><text x="531" y="360" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">inserted and deleted are rowsets</text><text x="531" y="386" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Match unchanged identity; compare marks</text><text x="531" y="412" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Insert both audit rows as a set</text><path d="M260 220 L260 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 220 L720 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="195" y="505" width="570" height="100" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="211" y="535" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">One enclosing transactional outcome</text><text x="211" y="565" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">COMMIT: keep base + audit changes</text><text x="211" y="591" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">ROLLBACK: undo both</text><path d="M260 435 L260 505" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 435 L720 505" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="655" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">NULL transitions need NULL-aware comparison. A scalar single-row assumption loses audit events.</text></svg>