<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Composite index: equality prefix, then range</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">Composite index: equality prefix, then range</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Conceptual key order for (course_code, mark), not an observed physical tree.</text><rect x="45" y="120" width="370" height="145" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="61" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Query predicate</text><text x="61" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">course_code = &#x27;DB101&#x27;</text><text x="61" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">mark &gt;= 80</text><text x="61" y="232" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Only the DB101 range is relevant.</text><rect x="510" y="120" width="400" height="240" rx="8" fill="white" stroke="#94a3b8"/><path d="M510 160H910" stroke="#94a3b8"/><text x="522" y="146" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">course_code</text><text x="682" y="146" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">mark</text><text x="782" y="146" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">student_id</text><text x="522" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">CS101</text><text x="682" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">74</text><text x="782" y="186" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">103</text><text x="522" y="226" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">CS101</text><text x="682" y="226" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">91</text><text x="782" y="226" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101</text><text x="522" y="266" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101</text><text x="682" y="266" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">82</text><text x="782" y="266" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">101</text><text x="522" y="306" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101</text><text x="682" y="306" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">88</text><text x="782" y="306" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">102</text><text x="522" y="346" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101</text><text x="682" y="346" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">NULL</text><text x="782" y="346" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">103</text><path d="M415 190 L465 190 L465 260 L510 260" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="355" width="370" height="155" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><text x="61" y="385" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Write maintenance</text><text x="61" y="415" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Base rows change</text><text x="61" y="441" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Relevant index entries change</text><text x="61" y="467" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Extra storage, logging, and work</text><rect x="510" y="415" width="400" height="100" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="526" y="445" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Important scope limit</text><text x="526" y="475" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">This sketch omits engine-specific</text><text x="526" y="501" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">NULL placement and row locators.</text><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">A useful index can still be ignored for a tiny or broad query. Confirm the chosen plan on your server.</text></svg>