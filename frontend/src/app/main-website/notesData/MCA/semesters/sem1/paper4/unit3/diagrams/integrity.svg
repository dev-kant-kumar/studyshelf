<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Three independent integrity obligations</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">Three independent integrity obligations</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">One proposed write must satisfy identity, reference, and domain rules.</text><rect x="270" y="110" width="420" height="85" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="286" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Proposed Enrolment fact</text><text x="286" y="170" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">(student_id, course_code, mark)</text><rect x="35" y="275" width="270" height="130" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="305" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Entity integrity</text><text x="51" y="335" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Pair must be unique</text><text x="51" y="361" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Both key columns required</text><rect x="345" y="275" width="270" height="130" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="361" y="305" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Referential integrity</text><text x="361" y="335" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Student must exist</text><text x="361" y="361" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Course must exist</text><rect x="655" y="275" width="270" height="130" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="671" y="305" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Domain integrity</text><text x="671" y="335" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Known mark: 0..100</text><text x="671" y="361" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">NULL permitted here</text><path d="M480 195 L480 235 L170 235 L170 275" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 195 L480 235 L480 235 L480 275" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 195 L480 235 L790 235 L790 275" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="450" width="270" height="85" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="480" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Reject: duplicate pairing</text><text x="51" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">(101, DB101, 50)</text><rect x="345" y="450" width="270" height="85" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/><text x="361" y="480" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Reject: missing parent</text><text x="361" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">(999, DB101, 50)</text><rect x="655" y="450" width="270" height="85" rx="10" fill="#fee2e2" stroke="#94a3b8" stroke-width="1.5"/><text x="671" y="480" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Reject: invalid mark</text><text x="671" y="510" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">(101, DB101, 120)</text><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">The application may validate early; the database enforces its declared rules for every writer.</text></svg>