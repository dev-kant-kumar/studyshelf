<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>A view definition versus a stored result</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">A view definition versus a stored result</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Both can expose summaries, but their freshness obligations differ.</text><rect x="45" y="130" width="270" height="130" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="61" y="160" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Base tables</text><text x="61" y="190" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Course: 3 rows</text><text x="61" y="216" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Enrolment: 5 rows</text><rect x="385" y="120" width="530" height="145" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="401" y="150" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Ordinary view</text><text x="401" y="180" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Stored query: LEFT JOIN + GROUP BY</text><text x="401" y="206" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Query computes DB101=3, CS101=2, AI101=0</text><text x="401" y="232" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Visible base changes affect later queries</text><rect x="385" y="355" width="530" height="145" rx="10" fill="#fef3c7" stroke="#94a3b8" stroke-width="1.5"/><text x="401" y="385" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Materialized or persisted summary</text><text x="401" y="415" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Stored result rows</text><text x="401" y="441" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">A separate refresh / maintenance policy</text><text x="401" y="467" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Can remain stale after base rows change</text><path d="M315 170 L385 170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 260 L180 425 L385 425" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="45" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">compute and store</text><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">An ordinary view is not automatically a cache; neither kind automatically supplies access control.</text></svg>