<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img"><title>Preserving the course with no enrolments</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#475569"/></marker></defs><rect width="960" height="600" rx="16" fill="#f8fafc"/><text x="36" y="43" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1e293b" text-anchor="start">Preserving the course with no enrolments</text><text x="36" y="76" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">LEFT JOIN constructs rows before aggregation counts actual child matches.</text><rect x="35" y="115" width="270" height="150" rx="10" fill="#dcfce7" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="145" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Left input: Course</text><text x="51" y="175" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101</text><text x="51" y="201" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">CS101</text><text x="51" y="227" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AI101</text><rect x="365" y="115" width="270" height="150" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="381" y="145" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Right input: Enrolment</text><text x="381" y="175" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101: 3 matching rows</text><text x="381" y="201" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">CS101: 2 matching rows</text><text x="381" y="227" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AI101: no matching row</text><path d="M305 185 L345 185" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="330" width="550" height="160" rx="10" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="51" y="360" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Intermediate LEFT JOIN rows</text><text x="51" y="390" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101: 3 rows with child IDs</text><text x="51" y="416" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">CS101: 2 rows with child IDs</text><text x="51" y="442" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AI101: 1 row with NULL child ID</text><path d="M500 265 L500 300 L300 300 L300 330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="665" y="330" width="250" height="160" rx="8" fill="white" stroke="#94a3b8"/><path d="M665 370H915" stroke="#94a3b8"/><text x="677" y="356" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">Course</text><text x="797" y="356" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">COUNT(child)</text><text x="677" y="396" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">DB101</text><text x="797" y="396" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">3</text><text x="677" y="436" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">CS101</text><text x="797" y="436" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">2</text><text x="677" y="476" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">AI101</text><text x="797" y="476" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">0</text><path d="M585 405 L665 405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="665" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">COUNT(*) would give AI101 = 1.</text><text x="36" y="575" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">A null-extended join row is not a stored enrolment. Count a required child key to count matches.</text></svg>